<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The page talks to exactly two hosts and loads nothing from anywhere else.
       Saying so in a policy the browser enforces turns that promise from a claim
       into a guarantee: a font CDN slipped in by accident, or an escape missed
       in a future edit, is blocked rather than silently working. `frame-ancestors`
       and `report-uri` are ignored in a meta tag and GitHub Pages cannot set
       headers, so clickjacking is not covered here. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    font-src 'self';
    img-src 'self' data:;
    connect-src https://pub.orcid.org https://api.ror.org;
    form-action 'none';
    base-uri 'none';
    object-src 'none'" />
  <title>orcid-finder: find the ORCID accounts that declare an institution</title>
  <meta name="description" data-i18n-attr="content:meta.description"
        content="Search ORCID for the accounts that declare an institution, by ROR id or organisation name, narrow by role title, start date, current appointments and who asserted the record, and download the result as CSV or JSON." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d4aff'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23ffffff' font-family='monospace' font-weight='bold'%3EiD%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css?v=7" />
  <script src="./src/theme-boot.js?v=7"></script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand-mark">
        <div class="brand-glyph" aria-hidden="true"></div>
        <div>
          <p class="brand-name">orcid-finder</p>
          <p class="brand-sub">rijdho.github.io</p>
        </div>
      </div>
      <p class="nav-label" data-i18n="nav.label">View</p>
      <nav aria-label="View" data-i18n-attr="aria-label:nav.label">
        <button class="nav-item active" data-view="search" type="button">
          <span class="nav-step">01</span><span data-i18n="nav.search">Search</span></button>
        <button class="nav-item" data-view="how" type="button">
          <span class="nav-step">02</span><span data-i18n="how.title">How it works</span></button>
        <button class="nav-item" data-view="caveats" type="button">
          <span class="nav-step">03</span><span data-i18n="caveats.title">Caveats</span></button>
        <button class="nav-item" data-view="about" type="button">
          <span class="nav-step">04</span><span data-i18n="about.title">About</span></button>
      </nav>
      <div class="rail-foot">
        <span data-i18n="rail.data">Data from ORCID and ROR</span><br />
        by <a href="https://rijdho.github.io" target="_blank" rel="noreferrer">@rijdho</a>
        · AGPL-3.0
        · <a href="https://github.com/rijdho/orcid-finder" target="_blank" rel="noreferrer">github</a><br />
        <a href="https://doi.org/10.5281/zenodo.22227424" target="_blank" rel="noreferrer"
           data-i18n-attr="title:rail.cite" title="Cite this tool">DOI 10.5281/zenodo.22227424</a>
      </div>
    </aside>

    <div class="main-col">
      <div class="cmdbar">
        <h1 class="cmd-title" id="cmd-title" data-i18n="nav.search">Search</h1>
        <div class="cmd-spacer"></div>
        <nav class="langs" id="lang" aria-label="Language" data-i18n-attr="aria-label:ui.lang.aria"></nav>
        <a class="ghost-btn" href="https://github.com/rijdho/orcid-finder" target="_blank" rel="noreferrer"
           data-i18n="ui.brand.source">source ↗</a>
        <button class="icon-btn" id="theme" aria-label="Toggle light/dark theme"
                data-i18n-attr="title:ui.theme.title;aria-label:ui.theme.aria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" /></svg>
        </button>
      </div>

      <main class="content">
        <div class="content-inner">

          <!-- ── 01 Search ───────────────────────────────────────────────── -->
          <section class="view" data-view="search">
            <p class="eyebrow" data-i18n="ui.brand.tagline">Find the ORCID accounts that declare an institution</p>
            <p class="lede" data-i18n-html="ui.lede"></p>

            <form class="panel" id="search" novalidate>
              <div class="cols">
                <div class="col">
                  <p class="col-title" data-i18n="form.legend.institution">The institution</p>
                  <label class="chk"><input type="checkbox" id="byRor" checked /> <span data-i18n="form.byRor">ROR id</span></label>
                  <label class="field"><span data-i18n="form.rors.label">ROR id(s), comma-separated</span>
                    <input class="input" id="rors" autocomplete="off" spellcheck="false"
                           data-i18n-attr="placeholder:form.rors.ph" placeholder="e.g. 056d84691" />
                  </label>
                  <p class="hint" data-i18n="form.rors.hint"></p>
                  <label class="field"><span data-i18n="form.ringgolds.label">Ringgold id(s), comma-separated</span>
                    <input class="input" id="ringgolds" autocomplete="off" spellcheck="false"
                           data-i18n-attr="placeholder:form.ringgolds.ph" placeholder="e.g. 27106" />
                  </label>
                  <p class="hint" data-i18n="form.ringgolds.hint"></p>
                  <label class="chk"><input type="checkbox" id="byName" checked /> <span data-i18n="form.byName">Organisation name</span></label>
                  <label class="field"><span data-i18n="form.orgNames.label">Organisation name(s), comma-separated</span>
                    <input class="input" id="orgNames" autocomplete="off"
                           data-i18n-attr="placeholder:form.orgNames.ph" placeholder="e.g. Karolinska Institutet" />
                  </label>
                  <p class="hint" data-i18n="form.orgNames.hint"></p>
                  <div class="field">
                    <span data-i18n="form.status.label">Affiliation</span>
                    <div class="radios" id="status" role="radiogroup" data-i18n-attr="aria-label:form.status.label">
                      <label class="chk"><input type="radio" name="status" value="any" checked /> <span data-i18n="form.status.any">Any</span></label>
                      <label class="chk"><input type="radio" name="status" value="current" /> <span data-i18n="form.status.current">Current</span></label>
                      <label class="chk"><input type="radio" name="status" value="past" /> <span data-i18n="form.status.past">Past</span></label>
                    </div>
                  </div>
                  <p class="hint" data-i18n="form.status.hint"></p>
                </div>

                <div class="col">
                  <p class="col-title" data-i18n="form.legend.employment">The employment</p>
                  <label class="field"><span data-i18n="form.roleTitles.label">Role title contains</span>
                    <input class="input" id="roleTitles" autocomplete="off"
                           data-i18n-attr="placeholder:form.roleTitles.ph" placeholder="professor, postdoc" />
                  </label>
                  <label class="field"><span data-i18n="form.excludeRoleTitles.label">Role title must not contain</span>
                    <input class="input" id="excludeRoleTitles" autocomplete="off"
                           data-i18n-attr="placeholder:form.excludeRoleTitles.ph" placeholder="phd, student" />
                  </label>
                  <label class="field"><span data-i18n="form.departments.label">Department contains</span>
                    <input class="input" id="departments" autocomplete="off"
                           data-i18n-attr="placeholder:form.departments.ph" placeholder="molecular medicine" />
                  </label>
                  <label class="field"><span data-i18n="form.countries.label">Country code(s)</span>
                    <input class="input" id="countries" autocomplete="off" spellcheck="false"
                           data-i18n-attr="placeholder:form.countries.ph" placeholder="SE, AT" />
                  </label>
                  <div class="pair">
                    <label class="field"><span data-i18n="form.startFrom.label">Started from</span>
                      <input class="input" id="startFrom" type="number" min="1900" max="2100" placeholder="2020" />
                    </label>
                    <label class="field"><span data-i18n="form.startTo.label">Started to</span>
                      <input class="input" id="startTo" type="number" min="1900" max="2100" placeholder="2026" />
                    </label>
                  </div>
                  <p class="hint" data-i18n="form.range.hint"></p>
                  <label class="chk"><input type="checkbox" id="currentOnly" /> <span data-i18n="form.currentOnly">Only current appointments</span></label>
                  <label class="chk"><input type="checkbox" id="requireStartDate" /> <span data-i18n="form.requireStartDate">Must have a start date</span></label>
                  <label class="chk"><input type="checkbox" id="assertedOnly" /> <span data-i18n="form.assertedOnly">Only records asserted by an organisation</span></label>
                  <p class="hint" data-i18n="form.employmentsHint"></p>
                </div>

                <div class="col">
                  <p class="col-title" data-i18n="form.legend.topic">Topic and scope</p>
                  <label class="field"><span data-i18n="form.keywords.label">Keyword(s), comma-separated</span>
                    <input class="input" id="keywords" autocomplete="off"
                           data-i18n-attr="placeholder:form.keywords.ph" placeholder="epidemiology, oncology" />
                  </label>
                  <p class="hint" data-i18n="form.keywords.hint"></p>
                  <label class="field"><span data-i18n="form.maxRows.label">Max candidates</span>
                    <!-- No `step`: with min=1 a step of 10 would only accept 1, 11, 21 … and the
                         browser silently rejects the default 200 on submit. -->
                    <input class="input" id="maxRows" type="number" min="1" max="1000" value="200" />
                  </label>
                  <p class="hint" data-i18n="form.maxRows.hint"></p>
                </div>
              </div>

              <div class="actions">
                <button class="btn primary" id="go" type="submit" data-i18n="form.submit">Search ORCID</button>
                <button class="btn" id="cancel" type="button" hidden data-i18n="form.cancel">Cancel</button>
                <button class="btn" id="reset" type="button" data-i18n="form.reset">Reset</button>
              </div>

              <div class="msg" id="error" hidden></div>

              <div class="progress" id="progress" hidden>
                <div class="bar"><span id="bar-fill"></span></div>
                <div class="lbl" id="bar-label"></div>
              </div>
            </form>

            <section class="panel" id="results" hidden aria-live="polite">
              <div class="panel-h">
                <h2 data-i18n="res.title">Results</h2>
                <span class="tag brand" id="mode-tag"></span>
                <div class="cmd-spacer"></div>
                <button class="btn" id="dl-csv" data-i18n="export.csv">Download CSV</button>
                <button class="btn" id="dl-json" data-i18n="export.json">Download JSON</button>
              </div>
              <div class="summary" id="summary"></div>
              <div class="chips" id="breakdown"></div>
              <div class="chips" id="ror-names"></div>
              <div class="query" id="query"></div>
              <p class="hint export-note" data-i18n="export.hint"></p>
              <div class="tablewrap" id="tablewrap"></div>
            </section>
          </section>

          <!-- ── 02 How it works ─────────────────────────────────────────── -->
          <section class="view" data-view="how" hidden>
            <p class="eyebrow" data-i18n="how.title">How it works</p>
            <div class="panel prose" data-i18n-html="how.body"></div>
          </section>

          <!-- ── 03 Caveats ──────────────────────────────────────────────── -->
          <section class="view" data-view="caveats" hidden>
            <p class="eyebrow" data-i18n="caveats.title">Caveats</p>
            <div class="panel prose" data-i18n-html="caveats.body"></div>
          </section>

          <!-- ── 04 About ────────────────────────────────────────────────── -->
          <section class="view" data-view="about" hidden>
            <p class="eyebrow" data-i18n="about.title">About</p>
            <div class="panel prose">
              <div data-i18n-html="about.body"></div>
              <p class="source-line" data-i18n-html="about.footer"></p>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./src/app.js?v=7"></script>
</body>
</html>
